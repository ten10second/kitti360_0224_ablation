# OneSlot warm-start from hybrid enhanced AR checkpoint
# Goal: keep architecture aligned with the enhanced AR model, then switch
# training objective to full-mask one-shot prediction.
device: cuda

# Model mode
mode: "hybrid"
hybrid_memory_source: "enhanced"

# Warm start
resume_ckpt: "runs/ar_hybrid_enhanced/ckpt_step_0050000.pt"

# Keep key architecture switches aligned with the enhanced checkpoint
use_pose_token: true
use_explicit_token_pos: false

# Data - Multi-drive configuration
data_root: "/media/user/574b4a05-57d2-424d-bb82-763098cbf0a4/shizhm/KITTI-360"
drives:
  - name: "2013_05_28_drive_0000_sync"
    frames_file: "train_frames.txt"
    weight: 1.0
  - name: "2013_05_28_drive_0002_sync"
    frames_file: "train_frames.txt"
    weight: 1.0
  - name: "2013_05_28_drive_0003_sync"
    frames_file: "train_frames.txt"
    weight: 1.0
  - name: "2013_05_28_drive_0005_sync"
    frames_file: "train_frames.txt"
    weight: 1.0
  - name: "2013_05_28_drive_0006_sync"
    frames_file: "train_frames.txt"
    weight: 1.0
  - name: "2013_05_28_drive_0007_sync"
    frames_file: "train_frames.txt"
    weight: 1.0
  - name: "2013_05_28_drive_0009_sync"
    frames_file: "train_frames.txt"
    weight: 1.0
  - name: "2013_05_28_drive_0010_sync"
    frames_file: "train_frames.txt"
    weight: 1.0

# Reproducibility
seed: 42
data_seed: 42
deterministic_data: true
shuffle: true
subset: null

# View configuration
use_fixed_five_views: true
use_ipm_semantic: false
fixed_view_turn_deg: 30.0
fourier_freqs: 10

# Performance optimization
perf:
  enable_tf32: true
  enable_sdpa: true
  channels_last: false
  torch_compile: false

# DataLoader optimization
loader:
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true

# DDP optimization
dist:
  find_unused_parameters: true
  static_graph: false

# DDP / DataLoader compatibility
num_workers: 4
ddp_strict_view: true
full_determinism: false
virtual_hfov: 80.0
virtual_w: 640
virtual_h: 256

# Model architecture
ntp_order: "topleft"
train_bev_encoder: false
no_bev_pretrain: false
d_model: 512
nhead: 8
num_layers: 8
grid_cols: 40
grid_rows: 16
bos_token: 1024
n_pose_queries: 64

# Training
# Resume from step 50000 and continue a short focused run.
steps: 60000
batch_size: 10
accum_steps: 1
lr: 2.0e-5
weight_decay: 0.01
grad_clip: 1.0
use_warmup_cosine: true
warmup_updates: 800
min_lr: 1.0e-6
label_smoothing: 0.0
ce_weight: 1.0

# Training-time mask curriculum for smoother AR -> OneSlot adaptation.
oneslot_mask_start_ratio: 0.4
oneslot_mask_end_ratio: 1.0
oneslot_mask_ramp_steps: 4000
oneslot_mask_schedule: "cosine"

# Keep consistency loss off for this focused warm-start
use_consistency_loss: false
consistency_weight: 0.1
consistency_temperature: 0.5

# Checkpointing & logging
out_dir: "runs/ar_oneslot_warmstart_enhanced"
print_every: 100
save_every: 2000
vis_every: 500
plot_every: 100

# Decoding params used by inherited visualization path
maskgit_mode: true
maskgit_num_steps: 1
maskgit_temperature: 1.0
maskgit_top_k: 50

# Paths
vq_ckpt: "ckpts/maskgit-vqgan-imagenet-f16-256.bin"
