# ICASSP27 Round-2 target-centric grounding pilot (B2 by default).
# B0: --use_src false; B1: --use_sat false.  Do not overwrite legacy pilots.
device: cuda
seed: 42
out_dir: runs/icassp27_tc_b2
vq_ckpt: ckpts/maskgit-vqgan-imagenet-f16-256.bin

data:
  train_manifest: dataset_splits/kitti360_geofence_buffer30/train_manifest.jsonl
  val_manifest: dataset_splits/kitti360_geofence_buffer30/val_manifest.jsonl
  test_manifest: dataset_splits/kitti360_geofence_buffer30/test_manifest.jsonl
  img_size: [640, 256]
  window_m: 60.0
  anchor_spacing_m: 2.0
  anchor_stride_m: 4.0
  k_min: 1
  k_max: 3
  dist_min_m: 2.0
  dist_max_m: 20.0
  dyaw_max_deg: 20.0

model:
  vocab_size: 1024
  d_model: 512
  nhead: 8
  num_layers: 8
  dim_feedforward: 2048
  dropout: 0.1
  max_seq_len: 1080
  pose_dim: 13
  dino_arch: vitb14
  sat_encoder: dino
  geo: raymap
  use_sat: true
  use_src: true
  sat_pe_mode: target_relative
  sat_px: 512
  sat_m_per_px: 0.196

train:
  steps: 20000
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 1000
  min_lr: 1.0e-5
  label_smoothing: 0.0
  print_every: 50
  vis_every: 500
  save_every: 2000

loader:
  num_workers: 8
