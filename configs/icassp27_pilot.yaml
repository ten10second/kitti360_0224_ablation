# ICASSP27 pilot config (Phase A tokenizer, B2 = sat+src fusion)
# B0: --use_src false   B1: --use_sat false   B2: default
device: cuda
seed: 42
out_dir: runs/icassp27_b2
vq_ckpt: ckpts/maskgit-vqgan-imagenet-f16-256.bin   # Phase A tokenizer (kept)

data:
  train_manifest: dataset_splits/kitti360_geofence_buffer30/train_manifest.jsonl
  val_manifest: dataset_splits/kitti360_geofence_buffer30/val_manifest.jsonl
  test_manifest: dataset_splits/kitti360_geofence_buffer30/test_manifest.jsonl
  img_size: [640, 256]        # (W,H) front view, 40x16 = 640 tokens @ f16
  window_m: 60.0              # route window; shared satellite crop per window
  anchor_spacing_m: 2.0       # sources >= 2 m apart (doc sec.4)
  anchor_stride_m: 4.0        # anchor candidates every 4 m
  k_min: 1
  k_max: 3                    # K ~ U{1,2,3}
  dist_min_m: 2.0
  dist_max_m: 20.0            # target metric distance range
  dyaw_max_deg: 20.0          # turn filter

model:
  vocab_size: 1024
  d_model: 512
  nhead: 8
  num_layers: 8
  dim_feedforward: 2048
  dropout: 0.1
  max_seq_len: 1080
  pose_dim: 13                # e_pose (kept pipeline)
  dino_arch: vitb14           # DINOv2 ViT-B/14 (official ckpt is patch-14)
  sat_encoder: dino           # "satmae" reserved as ablation branch
  use_sat: true
  use_src: true
  fourier_freqs: 10           # metric PE (Fourier encoder kept from H_geo)
  sat_px: 512
  sat_m_per_px: 0.196         # measured (v2b), isotropic KITTI-360

train:
  steps: 20000
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 1000
  min_lr: 1.0e-5
  label_smoothing: 0.0
  print_every: 50
  vis_every: 500
  save_every: 2000

loader:
  num_workers: 8
