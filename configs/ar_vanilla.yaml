# Legacy vanilla AR baseline (post-ICASSP27 refactor: vanilla-only predictor,
# pose token memory; BEV/anchor/RayRoPE paths removed).
# Drives follow the geofence split (dataset_splits/kitti360_geofence_buffer30):
# train = {0000,0005,0006,0009,0010}; {0002,0003}=test, {0007}=val are excluded.
device: cuda

# Data - Multi-drive configuration
data_root: "/media/shizhm/Lenovo/KITTI-360"
drives:
  - name: "2013_05_28_drive_0000_sync"
    frames_file: "train_frames.txt"
    weight: 1.0
  - name: "2013_05_28_drive_0005_sync"
    frames_file: "train_frames.txt"
    weight: 1.0
  - name: "2013_05_28_drive_0006_sync"
    frames_file: "train_frames.txt"
    weight: 1.0
  - name: "2013_05_28_drive_0009_sync"
    frames_file: "train_frames.txt"
    weight: 1.0
  - name: "2013_05_28_drive_0010_sync"
    frames_file: "train_frames.txt"
    weight: 1.0

# Reproducibility
seed: 42
data_seed: 42
deterministic_data: true
shuffle: true  # Shuffle across all drives
subset: null

# View configuration
p_front: 0.6
yaw_min_abs: 0.0
yaw_max_abs: 40.0
use_fixed_five_views: true
fixed_view_turn_deg: 30.0

# Performance optimization parameters
perf:
  enable_tf32: true
  enable_sdpa: true
  channels_last: false
  torch_compile: false

# DataLoader optimization
# (num_workers=0: cv2 remap inside forked workers aborts on this machine)
loader:
  num_workers: 0
  prefetch_factor: 2
  persistent_workers: false

# DDP optimization
dist:
  find_unused_parameters: true
  static_graph: false

# DDP / DataLoader (backward compatibility)
num_workers: 8
ddp_strict_view: true
full_determinism: false
virtual_hfov: 80.0
virtual_w: 640
virtual_h: 256

# Model architecture
ntp_order: "topleft"
d_model: 512
nhead: 8
num_layers: 8
grid_cols: 40
grid_rows: 16
bos_token: 1024

# Training
steps: 80000
batch_size: 15
accum_steps: 2
lr: 1.0e-4
weight_decay: 0.01
grad_clip: 1.0
use_warmup_cosine: true
warmup_updates: 4000
min_lr: 1.0e-6
label_smoothing: 0.0
ce_weight: 1.0

# Checkpointing & Logging
out_dir: "runs/ar_vanilla"
print_every: 100
save_every: 5000
vis_every: 1000
plot_every: 100

# Sampling & Visualization
vis_top_k: 50
vis_temperature: 0.9

# Paths
vq_ckpt: "ckpts/maskgit-vqgan-imagenet-f16-256.bin"
